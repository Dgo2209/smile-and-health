<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>Smile and Health - Sistema Integral de Gestión Odontológica</title>
  <meta name="description" content="Sistema integral para clínicas y consultorios odontológicos. Agenda digital, expediente clínico, odontograma interactivo FDI, consentimientos con firma digital y cumplimiento NOM-004-SSA3-2012." />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Modern Clinical Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Inicio de sesión (visible solo en modo servidor / Supabase) -->
  <div class="login-overlay" id="login-overlay" hidden>
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"></path>
            <circle cx="12" cy="9" r="2.5"></circle>
          </svg>
        </div>
        <div>
          <h2>Smile and Health</h2>
          <p>Acceso exclusivo para el personal de la clínica</p>
        </div>
      </div>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Correo electrónico</label>
          <input type="email" id="login-email" class="form-control" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" class="form-control" autocomplete="current-password" required />
        </div>
        <div class="login-error" id="login-error" role="alert" hidden></div>
        <button type="submit" class="btn btn-primary login-submit" id="login-submit">Entrar</button>
      </form>
    </div>
  </div>

  <!-- App Sticky Header (Fiel al Prototipo UACM) -->
  <header class="app-header">
    <div class="header-inner">
      <!-- Brand & Practitioner Identity -->
      <div class="brand-wrapper">
        <div class="brand-logo-icon" title="Smile and Health Dental Clinic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"></path>
            <circle cx="12" cy="9" r="2.5"></circle>
          </svg>
        </div>
        <div class="brand-info">
          <h1>
            Smile and Health
            <span class="badge-clinic">CLÍNICA</span>
          </h1>
          <div class="brand-subtitle">
            Consultorio Dental • <span class="doctor-active" id="header-doctor-name">Dr. Alejandro Mendoza Herrera</span>
          </div>
        </div>
      </div>

      <!-- Quick Action Buttons -->
      <div class="header-actions">
        <button class="btn btn-secondary btn-sm" id="btn-header-new-appt">
          ➕ Nueva Cita
        </button>
        <button class="btn btn-secondary btn-sm" id="btn-header-new-patient">
          ➕ Nuevo Paciente
        </button>
      </div>
    </div>
  </header>

  <!-- Main Navigation Tabs Bar -->
  <nav class="nav-tabs-bar">
    <div class="nav-tabs-inner">
      <a href="#agenda" class="nav-tab active" data-view="agenda">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Agenda y Citas
      </a>

      <a href="#pacientes" class="nav-tab" data-view="pacientes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Pacientes e Historial
      </a>

      <a href="#odontograma" class="nav-tab" data-view="odontograma">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        Odontograma Clínico
      </a>

      <a href="#evolucion" class="nav-tab" data-view="evolucion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Notas de Evolución
      </a>

      <a href="#consentimientos" class="nav-tab" data-view="consentimientos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Consentimientos Digitales
      </a>
    </div>
  </nav>

  <!-- Main View Container -->
  <main class="main-wrapper">
    <div id="view-agenda" class="module-view active"></div>
    <div id="view-pacientes" class="module-view"></div>
    <div id="view-odontograma" class="module-view"></div>
    <div id="view-evolucion" class="module-view"></div>
    <div id="view-consentimientos" class="module-view"></div>
  </main>

  <!-- Application Logic & Scripts -->
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/remote.js"></script>
  <script src="js/components/signature-pad.js"></script>
  <script src="js/components/odontogram.js"></script>
  <script src="js/components/agenda.js"></script>
  <script src="js/components/patients.js"></script>
  <script src="js/components/evolution.js"></script>
  <script src="js/components/consents.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
